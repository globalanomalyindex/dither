name: Verify

on:
  push:
    branches:
      - main
      - agent/dither-00-verification-foundation
  pull_request:

permissions:
  contents: read

jobs:
  portable-server-contract:
    name: Portable server contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run portable server contract tests
        run: python -m unittest tests/test_serve.py -v

  foundation-contracts:
    name: Foundation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run foundation contract tests
        run: node --test tests/foundation/*.test.mjs

  package-lock-drift:
    name: Package lock drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate package lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify package lock is current
        run: git diff --exit-code -- package-lock.json

  accessible-tabs-migration:
    name: Apply accessible tab contract once
    if: github.event_name == 'push' && github.ref_name == 'agent/dither-00-verification-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/dither-00-verification-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Apply semantic tab markup and behavior
        shell: python
        run: |
          from pathlib import Path

          index_path = Path("index.html")
          index_source = index_path.read_text(encoding="utf-8")
          old_tabs = '''      <div class="tab-group" role="tablist">
                  <button class="tab-btn active" data-tab="dither">Dither</button>
                  <button class="tab-btn" data-tab="grain">Grain</button>
                  <button class="tab-btn" data-tab="paintstroke">Paint</button>
                </div>'''
          new_tabs = '''      <div class="tab-group" role="tablist" aria-label="Creative mode">
                  <button id="tab-button-dither" class="tab-btn active" data-tab="dither" type="button" role="tab" aria-selected="true" aria-controls="tab-dither" tabindex="0">Dither</button>
                  <button id="tab-button-grain" class="tab-btn" data-tab="grain" type="button" role="tab" aria-selected="false" aria-controls="tab-grain" tabindex="-1">Grain</button>
                  <button id="tab-button-paintstroke" class="tab-btn" data-tab="paintstroke" type="button" role="tab" aria-selected="false" aria-controls="tab-paintstroke" tabindex="-1">Paint</button>
                </div>'''
          if index_source.count(old_tabs) != 1:
              raise SystemExit("Expected one header tab block")
          index_source = index_source.replace(old_tabs, new_tabs)

          panel_replacements = {
              '<div id="tab-dither" class="tab-content active">': '<div id="tab-dither" class="tab-content active" role="tabpanel" aria-labelledby="tab-button-dither">',
              '<div id="tab-grain" class="tab-content" style="display:none;">': '<div id="tab-grain" class="tab-content" role="tabpanel" aria-labelledby="tab-button-grain" style="display:none;">',
              '<div id="tab-paintstroke" class="tab-content" style="display:none;">': '<div id="tab-paintstroke" class="tab-content" role="tabpanel" aria-labelledby="tab-button-paintstroke" style="display:none;">',
          }
          for old, new in panel_replacements.items():
              if index_source.count(old) != 1:
                  raise SystemExit(f"Expected one panel opening: {old}")
              index_source = index_source.replace(old, new)
          index_path.write_text(index_source, encoding="utf-8")

          app_path = Path("app.js")
          app_source = app_path.read_text(encoding="utf-8")
          old_behavior = '''  document.querySelectorAll('.tab-btn').forEach(btn => {
              btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                if (tab === activeTab) return;
                activeTab = tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
                $('tab-dither').style.display = tab === 'dither' ? '' : 'none';
                $('tab-grain').style.display = tab === 'grain' ? '' : 'none';
                $('tab-paintstroke').style.display = tab === 'paintstroke' ? '' : 'none';
                applyTabBodyClass(tab);
                // Show/hide brush cursor based on tab + canvas hover
                updateCursorVisibility();
                // Set canvas cursor
                canvasWrapper.style.cursor = tab === 'paintstroke' ? 'none' : '';
                // Exit pickup mode and hide its prompt when leaving paintstroke tab
                if (tab !== 'paintstroke') exitPickupMode();
              });
            });'''
          new_behavior = '''  const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));
            const tabPanelIds = ['dither', 'grain', 'paintstroke'];

            const setActiveTab = (tab, { focus = false } = {}) => {
              if (!tabPanelIds.includes(tab)) return;
              const changed = tab !== activeTab;
              activeTab = tab;

              tabButtons.forEach(button => {
                const isActive = button.dataset.tab === tab;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-selected', isActive ? 'true' : 'false');
                button.tabIndex = isActive ? 0 : -1;
              });

              tabPanelIds.forEach(panelTab => {
                $('tab-' + panelTab).style.display = panelTab === tab ? '' : 'none';
              });

              if (changed) {
                applyTabBodyClass(tab);
                updateCursorVisibility();
                canvasWrapper.style.cursor = tab === 'paintstroke' ? 'none' : '';
                if (tab !== 'paintstroke') exitPickupMode();
              }

              if (focus) {
                const activeButton = tabButtons.find(button => button.dataset.tab === tab);
                if (activeButton) activeButton.focus();
              }
            };

            tabButtons.forEach((btn, index) => {
              btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
              btn.addEventListener('keydown', event => {
                let nextIndex = null;
                if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                  nextIndex = (index + 1) % tabButtons.length;
                } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                  nextIndex = (index - 1 + tabButtons.length) % tabButtons.length;
                } else if (event.key === 'Home') {
                  nextIndex = 0;
                } else if (event.key === 'End') {
                  nextIndex = tabButtons.length - 1;
                } else {
                  return;
                }

                event.preventDefault();
                const nextButton = tabButtons[nextIndex];
                setActiveTab(nextButton.dataset.tab, { focus: true });
              });
            });'''
          if app_source.count(old_behavior) != 1:
              raise SystemExit("Expected one legacy tab behavior block")
          app_path.write_text(
              app_source.replace(old_behavior, new_behavior),
              encoding="utf-8",
          )

      - name: Format the browser regression test
        run: npx prettier --write tests/e2e/entry.spec.js

      - name: Commit the accessibility correction when present
        shell: bash
        run: |
          if git diff --quiet -- index.html app.js tests/e2e/entry.spec.js; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js tests/e2e/entry.spec.js
          git commit -m "fix: implement accessible creative tabs"
          git push origin HEAD:agent/dither-00-verification-foundation

  toolchain:
    name: Toolchain verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint new toolchain files
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Build static runtime
        run: npm run build

      - name: Verify deterministic build manifest
        shell: bash
        run: |
          cp dist/build-manifest.json /tmp/build-manifest.json
          npm run build
          cmp /tmp/build-manifest.json dist/build-manifest.json

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Browser smoke verification
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static runtime
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
