name: Verify

on:
  push:
    branches:
      - main
      - agent/dither-00-verification-foundation
  pull_request:

permissions:
  contents: read

jobs:
  portable-server-contract:
    name: Portable server contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run portable server contract tests
        run: python -m unittest tests/test_serve.py -v

  foundation-contracts:
    name: Foundation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run foundation contract tests
        run: node --test tests/foundation/*.test.mjs
