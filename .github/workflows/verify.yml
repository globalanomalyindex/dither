name: Verify

on:
  push:
    branches:
      - main
      - agent/dither-00-verification-foundation
  pull_request:

permissions:
  contents: read

jobs:
  portable-server-contract:
    name: Portable server contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run portable server contract tests
        run: python -m unittest tests/test_serve.py -v

  foundation-contracts:
    name: Foundation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run foundation contract tests
        run: node --test tests/foundation/*.test.mjs

  lockfile-candidate:
    name: Verify or create package lock
    if: github.event_name == 'push' && github.ref_name == 'agent/dither-00-verification-foundation'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: agent/dither-00-verification-foundation

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Detect committed lockfile
        id: lock-state
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify committed lockfile is current
        if: steps.lock-state.outputs.tracked == 'true'
        run: git diff --exit-code -- package-lock.json

      - name: Commit generated lockfile
        if: steps.lock-state.outputs.tracked == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit generated package lock"
          git push origin HEAD:agent/dither-00-verification-foundation

      - name: Upload package lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-evidence
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

  toolchain:
    name: Toolchain verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint new toolchain files
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npx eslint scripts tests *.config.mjs --format json > artifacts/lint-report.json
          status=$?
          set -e
          cat artifacts/lint-report.json
          exit "$status"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: artifacts/lint-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify formatting
        shell: bash
        run: |
          set +e
          npx prettier --list-different scripts src tests *.config.mjs package.json tsconfig.json .prettierrc.json > artifacts/prettier-report.txt
          status=$?
          set -e
          cat artifacts/prettier-report.txt
          exit "$status"

      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-diagnostics
          path: artifacts/prettier-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Run unit tests
        run: npm run test:unit

      - name: Build static runtime
        run: npm run build

  browser-smoke:
    name: Browser smoke verification
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static runtime
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
