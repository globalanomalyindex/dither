name: Verify

on:
  push:
    branches:
      - main
      - agent/dither-00-verification-foundation
  pull_request:

permissions:
  contents: read

jobs:
  portable-server-contract:
    name: Portable server contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run portable server contract tests
        run: python -m unittest tests/test_serve.py -v

  foundation-contracts:
    name: Foundation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run foundation contract tests
        run: node --test tests/foundation/*.test.mjs

  registry-diagnostics:
    name: Registry diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Inspect legacy registry metadata
        shell: bash
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE' > artifacts/registry-diagnostics.json
          import { loadLegacyDitherRegistry } from "./tests/helpers/load-legacy-dither.mjs";

          const registry = await loadLegacyDitherRegistry();
          const issues = [];
          for (const algorithm of registry.algorithms) {
            if (typeof algorithm.id !== "string" || algorithm.id.trim() === "") {
              issues.push({ algorithm: algorithm.id ?? null, issue: "invalid-id", keys: Object.keys(algorithm) });
            }
            if (typeof algorithm.name !== "string" || algorithm.name.trim() === "") {
              issues.push({ algorithm: algorithm.id ?? null, issue: "invalid-name", name: algorithm.name ?? null, keys: Object.keys(algorithm) });
            }
            if (typeof algorithm.category !== "string" || algorithm.category.trim() === "") {
              issues.push({ algorithm: algorithm.id ?? null, issue: "invalid-category", category: algorithm.category ?? null, keys: Object.keys(algorithm) });
            }
            if (typeof algorithm.apply !== "function") {
              issues.push({ algorithm: algorithm.id ?? null, issue: "invalid-apply", keys: Object.keys(algorithm) });
            }
            if (!Array.isArray(algorithm.params)) {
              issues.push({ algorithm: algorithm.id ?? null, issue: "invalid-params", paramsType: typeof algorithm.params, keys: Object.keys(algorithm) });
              continue;
            }
            const parameterIds = algorithm.params.map((parameter) => parameter.id);
            if (new Set(parameterIds).size !== parameterIds.length) {
              issues.push({ algorithm: algorithm.id, issue: "duplicate-parameter-id", parameterIds });
            }
            for (const parameter of algorithm.params) {
              if (typeof parameter.id !== "string" || parameter.id.trim() === "") {
                issues.push({ algorithm: algorithm.id, issue: "invalid-parameter-id", parameter });
              }
              try {
                structuredClone(parameter.default);
              } catch (error) {
                issues.push({ algorithm: algorithm.id, issue: "uncloneable-default", parameterId: parameter.id ?? null, message: error.message });
              }
            }
          }

          const categoryCounts = {};
          for (const algorithm of registry.algorithms) {
            const category = String(algorithm.category ?? "<missing>");
            categoryCounts[category] = (categoryCounts[category] ?? 0) + 1;
          }

          process.stdout.write(JSON.stringify({
            sourceSha256: registry.sourceSha256,
            count: registry.algorithms.length,
            firstEntry: registry.algorithms[0]
              ? {
                  keys: Object.keys(registry.algorithms[0]),
                  id: registry.algorithms[0].id ?? null,
                  name: registry.algorithms[0].name ?? null,
                  category: registry.algorithms[0].category ?? null,
                  parameterKeys: registry.algorithms[0].params?.[0]
                    ? Object.keys(registry.algorithms[0].params[0])
                    : [],
                }
              : null,
            categoryCounts,
            issues,
          }, null, 2));
          NODE

      - name: Upload registry diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: registry-diagnostics
          path: artifacts/registry-diagnostics.json
          if-no-files-found: error
          retention-days: 1

  package-lock-drift:
    name: Package lock drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Regenerate package lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify package lock is current
        run: git diff --exit-code -- package-lock.json

  toolchain:
    name: Toolchain verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint new toolchain files
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npx eslint scripts tests *.config.mjs --format json > artifacts/lint-report.json
          status=$?
          set -e
          cat artifacts/lint-report.json
          exit "$status"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: artifacts/lint-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify formatting
        shell: bash
        run: |
          set +e
          npx prettier --list-different scripts src tests *.config.mjs package.json tsconfig.json .prettierrc.json > artifacts/prettier-report.txt
          status=$?
          set -e
          cat artifacts/prettier-report.txt
          exit "$status"

      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-diagnostics
          path: artifacts/prettier-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Run unit tests
        run: npm run test:unit

      - name: Build static runtime
        run: npm run build

      - name: Verify deterministic build manifest
        shell: bash
        run: |
          cp dist/build-manifest.json /tmp/build-manifest.json
          npm run build
          cmp /tmp/build-manifest.json dist/build-manifest.json

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: dist/build-manifest.json
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Browser smoke verification
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static runtime
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
